name: bright-vintage-main

# Host-process env var passthroughs for local app services.
# Populate these by running `task up` from the repo root (wraps
# `dotenvx run -f .env.development -- docker compose up`), or by
# exporting them in your shell before starting compose.
# Unset vars resolve to empty strings so compose does not warn.
x-dev-env-vars: &dev-env-vars
  MAIN_DB_POSTGRES_USER: postgres
  MAIN_DB_POSTGRES_PASSWORD: postgres
  MAIN_DB_POSTGRES_DB: maindb

  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

  S3_UPLOAD_BUCKET: ${S3_UPLOAD_BUCKET:-development.file-uploads-b9e1bda}

  # Cloudflare Access verification for /admin routes (blank in local dev)
  CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
  CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}

services:
  main-api:
    container_name: main-api
    build:
      context: ../..
      dockerfile: backend/main-api/main-api.Dockerfile
      args:
        VERSION: dev
    environment:
      <<: *dev-env-vars
      ENV: development
      SERVER_PORT: "3000"
      MAIN_DB_URL: postgresql://postgres:postgres@db-main-api:5432/maindb?sslmode=disable
      S3_BASE_ENDPOINT: http://floci:4566
    ports:
      - "3000:3000"
    depends_on:
      db-main-api:
        condition: service_healthy
      db-main-api-migrate:
        condition: service_completed_successfully
      floci:
        condition: service_started

  # used by main-api
  db-main-api:
    container_name: db-main-api
    image: postgres:17-alpine
    environment:
      <<: *dev-env-vars
      POSTGRES_USER: ${MAIN_DB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MAIN_DB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${MAIN_DB_POSTGRES_DB:-maindb}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-d",
          "maindb",
          "-h",
          "db-main-api",
          "-p 5432",
          "-U postgres",
        ]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s

  db-main-api-migrate:
    container_name: db-main-api-migrate
    image: arigaio/atlas:latest
    environment:
      <<: *dev-env-vars
      POSTGRES_USER: ${MAIN_DB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MAIN_DB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${MAIN_DB_POSTGRES_DB:-maindb}
    command: >
      migrate apply
      --url "postgres://postgres:postgres@db-main-api:5432/maindb?sslmode=disable"
      --dir "file:///sql/migrate"
      --revisions-schema "public"
      --allow-dirty
    volumes:
      - ../../backend/main-api/db/migrations:/sql/migrate
    depends_on:
      db-main-api:
        condition: service_healthy

  floci:
    image: hectorvent/floci:latest-aws
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "4566:4566"
    volumes:
      - ./data/s3:/app/data
      - ./data/reregister-floci-orphans.sh:/etc/floci/init/start.d/reregister-orphans.sh:ro
