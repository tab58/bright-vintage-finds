name: Unit Tests

on:
  pull_request:
    paths:
      - "backend/main-api/**"
    branches:
      - main
  workflow_dispatch:

jobs:
  # ponytail: single service — trigger paths replace the dorny/paths-filter
  # detect-changes job; reinstate it when a second service appears.
  main-api:
    uses: ./.github/workflows/_go-unit-tests.yml
    with:
      service-path: backend/main-api
      go-version: "1.25.x"
