name: Reusable -- Go semantic release + Docker build

on:
  workflow_call:
    inputs:
      service-path:
        description: "Path to the Go service (e.g., backend/main-api)"
        required: true
        type: string
      image-name:
        description: "Docker image name (e.g., main-api)"
        required: true
        type: string
      tag-prefix:
        description: "Semantic release tag prefix (e.g., main-api/v)"
        required: true
        type: string
      docker-context:
        description: "Docker build context relative to repo root (e.g., backend/main-api or .)"
        required: false
        default: ""
        type: string
      dockerfile-path:
        description: "Path to Dockerfile relative to repo root (e.g., backend/main-api/Dockerfile)"
        required: false
        default: ""
        type: string
    outputs:
      new_release_version:
        description: "Semantic release version that was published (empty if none)"
        value: ${{ jobs.release.outputs.new_release_version }}
      new_release_published:
        description: "'true' if a new release was published"
        value: ${{ jobs.release.outputs.new_release_published }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_version: ${{ steps.save-output.outputs.new_release_version }}
      new_release_published: ${{ steps.save-output.outputs.new_release_published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: releaser
        uses: cycjimmy/semantic-release-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ci: true
          working_directory: ${{ inputs.service-path }}
          tag_format: "${{ inputs.tag-prefix }}${version}"

      - name: Save output
        id: save-output
        run: |
          echo "new_release_version=${{ steps.releaser.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
          echo "new_release_published=${{ steps.releaser.outputs.new_release_published }}" >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag, and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context || inputs.service-path }}
          file: ${{ inputs.dockerfile-path || format('{0}/Dockerfile', inputs.service-path) }}
          push: true
          build-args: VERSION=${{ needs.release.outputs.new_release_version }}
          tags: |
            ghcr.io/tab58/${{ inputs.image-name }}:${{ needs.release.outputs.new_release_version }}
            ghcr.io/tab58/${{ inputs.image-name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
